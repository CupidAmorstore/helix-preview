<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HELIX (Apex App)</title>
    <meta http-equiv="refresh" content="0; url=./" />
    <script>
      // GitHub Pages SPA fallback: redirect all routes to index.
      var parts = window.location.pathname.split('/');
      var base = parts.slice(0, 2).join('/') + '/';
      var rest = window.location.pathname.replace(base, '');
      var target = base + '#/' + rest + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
