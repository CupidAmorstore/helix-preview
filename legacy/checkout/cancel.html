<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HELIX | Checkout Canceled</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/helix_icon.ico">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="checkout-page">
  <main class="section checkout-main">
    <div class="shell checkout-shell">
      <div class="checkout-intro">
        <h1>Checkout Canceled</h1>
        <p class="subtitle">No payment was processed. You can still request manual access below.</p>
      </div>
      <div class="checkout-status-box">
        <div class="status-inner">
          <div class="status-message status-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>If you still want access, submit the request form on the access page.</span>
          </div>
        </div>
      </div>
      <a class="button ghost back-btn" href="../checkout/index.html">Return to access request</a>
    </div>
  </main>
</body>
</html>
