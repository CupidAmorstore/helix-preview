name: Android device test (emulator)

# Installs the real debug APK on an Android 15 emulator and drives it (real WebView, system bars, Back key).
# Evidence (screenshots + results.json) is published to the "android-e2e" pre-release. Paper trading only.
on:
  workflow_dispatch:
  push:
    branches:
      - ccr-8d17e0b5-yaqvtm
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: android-e2e
  cancel-in-progress: true

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: rm -rf dist/inspect
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../helix-e2e.apk
      - run: npm i --no-save playwright-core@1.49.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r helix-e2e.apk
            node scripts/android-e2e.cjs
      - name: Publish evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p e2e-out
          cd e2e-out && zip -qr ../android-e2e-evidence.zip . && cd ..
          gh release delete android-e2e --yes --cleanup-tag || true
          gh release create android-e2e android-e2e-evidence.zip e2e-out/results.json \
            --prerelease --target "${GITHUB_SHA}" \
            --title "HELIX Android emulator test (run #${{ github.run_number }})" \
            --notes "Real debug APK on an Android 15 (API 35) emulator, ${GITHUB_SHA::7}. Screenshots and results.json. Emulator, not a physical phone."
