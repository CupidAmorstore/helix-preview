name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # owner-requested public preview of the current app (paper trading only)
      - ccr-8d17e0b5-yaqvtm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # project site lives at https://cupidamorstore.github.io/helix-preview/
          VITE_BASE: /helix-preview/
      # single-page app: unknown paths (e.g. /markets/BTC) are served the app shell
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
